[package]
name = "harn-bitbucket-connector"
version = "0.2.0"
description = "Pure-Harn Bitbucket connector: Cloud/Data Center webhooks, HMAC verification, and REST dispatch."
license = "MIT OR Apache-2.0"
repository = "https://github.com/burin-labs/harn-bitbucket-connector"
connector_contract = "v1"

[exports]
default = "src/lib.harn"

[[providers]]
id = "bitbucket"
connector = { harn = "src/lib.harn" }
capabilities = ["webhook", "rate_limit", "pagination"]

[providers.setup]
auth_type = "api-key"
flow = "api-key"
required_secrets = ["bitbucket/api-token", "bitbucket/webhook-secret"]
setup_command = ["harn", "connect", "bitbucket"]
validation_command = ["harn", "connect", "status", "--connector", "bitbucket", "--json"]

[[providers.setup.health_checks]]
id = "api-token"
kind = "secret"
secret = "bitbucket/api-token"

[[providers.setup.health_checks]]
id = "webhook-secret"
kind = "secret"
secret = "bitbucket/webhook-secret"

[providers.setup.recovery]
missing_auth = "Store bitbucket/api-token and bitbucket/webhook-secret before enabling Bitbucket bindings."
expired_credentials = "Rotate bitbucket/api-token, then rerun the Bitbucket connection validation."
revoked_credentials = "Replace bitbucket/api-token with an active Bitbucket app password or access token."
missing_scopes = "Grant repository and pull request scopes required by the configured Bitbucket workflows."
inaccessible_resource = "Confirm the token can access the target Bitbucket workspace and repository."
transient_provider_outage = "Retry after Bitbucket API and webhook delivery endpoints are healthy."

[dependencies]

[connector_contract]
version = 1

[[connector_contract.fixtures]]
provider = "bitbucket"
name = "happy path"
kind = "webhook"
headers = { "x-event-key" = "pullrequest:created", "x-hook-uuid" = "delivery-1", "x-hub-signature" = "sha256=3d1e3278d4e0b431025b61675c47d01b69a551386a8e8b5cedb53fb680ce1e90" }
metadata = { secret_ids = { signing_secret = "bitbucket/signing_secret" } }
body = '''{"actor":{"display_name":"Ada"},"pullrequest":{"id":42,"title":"Improve widgets"},"repository":{"full_name":"acme/widgets"}}'''
expect_type = "event"
expect_kind = "pullrequest.created"
expect_signature_state = "verified"
expect_event_count = 1
expect_payload_contains = { provider = "bitbucket", raw = { event = "pullrequest:created" } }

[[connector_contract.fixtures]]
provider = "bitbucket"
name = "malformed payload"
kind = "webhook"
headers = { "x-event-key" = "pullrequest:created", "x-hub-signature" = "sha256=2e8a6d0d0886bf7e1611c8218f880cdd4fbacea49c260b7ba4adc2dd0beffd03" }
metadata = { secret_ids = { signing_secret = "bitbucket/signing_secret" } }
body = "{not json"
expect_type = "reject"
expect_response_status = 400
expect_event_count = 0
