[package]
name = "harn-bitbucket-connector"
version = "0.1.0"
description = "Pure-Harn Bitbucket connector: Cloud/Data Center webhooks, HMAC verification, and REST dispatch."
license = "MIT OR Apache-2.0"
repository = "https://github.com/burin-labs/harn-bitbucket-connector"
connector_contract = "v1"

[exports]
default = "src/lib.harn"

[[providers]]
id = "bitbucket"
connector = { harn = "src/lib.harn" }

[dependencies]

[connector_contract]
version = 1

[[connector_contract.fixtures]]
provider = "bitbucket"
name = "happy path"
kind = "webhook"
headers = { "x-event-key" = "pullrequest:created", "x-hook-uuid" = "delivery-1" }
body_json = { repository = { full_name = "acme/widgets" }, actor = { display_name = "Ada" }, pullrequest = { id = 42, title = "Improve widgets" } }
expect_type = "event"
expect_kind = "pullrequest.created"
expect_signature_state = "unsigned"
expect_event_count = 1
expect_payload_contains = { provider = "bitbucket", raw = { event = "pullrequest:created" } }

[[connector_contract.fixtures]]
provider = "bitbucket"
name = "malformed payload"
kind = "webhook"
headers = { "x-event-key" = "pullrequest:created" }
body = "{not json"
expect_type = "reject"
expect_response_status = 400
expect_event_count = 0
